name: Android

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine tests
        run: ./gradlew :engine:test --console=plain

      - name: App UI tests (Robolectric) and screenshots
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: holdread-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/screenshots/

      # Screenshots go into the log as base64 too, so they can be read without downloading artifacts.
      - name: Print screenshots
        if: always()
        run: |
          for f in app/build/outputs/screenshots/*.jpg; do
            [ -f "$f" ] || continue
            echo "SCREENSHOT $(basename "$f") $(base64 -w0 "$f")"
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            engine/build/reports/tests/
            app/build/reports/tests/

      # Every push to main refreshes one pre-release, so the newest APK is always one tap away on the phone.
      - name: Publish latest debug APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk holdread-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug holdread-debug.apk --prerelease \
            --title "Latest debug build" \
            --notes "Built from ${GITHUB_SHA::7}. Debug build for testing; install over the previous one."
